<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#13795b">
<title>메디포스트 업무일지</title>
<style>
  :root { --bg:#f3f5f4; --card:#fff; --ink:#17201b; --mute:#5d6a63; --line:#d9e0dc; --go:#13795b; --go-soft:#e3f3ec;
          --amber:#8a5300; --amber-soft:#fff3dc; --red:#b42318; --red-soft:#fde8e6; --blue:#1d4ed8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:10px 12px 90px; }
  #banner { position:sticky; top:0; z-index:5; background:var(--amber-soft); color:var(--amber); font-weight:700; font-size:15px; padding:10px 14px; border-bottom:1px solid #ecd29a; }
  #banner.hide { display:none; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:4px 2px 6px; }
  .ttl { font-size:22px; font-weight:800; }
  .who { font-size:14px; color:var(--mute); text-align:right; }
  .who a, a.lnk { color:var(--blue); }
  .day { display:flex; align-items:center; justify-content:center; gap:10px; margin:6px 0 2px; }
  .day b { font-size:22px; }
  .day button { width:46px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:20px; color:var(--ink); }
  .day button:disabled { opacity:.35; }
  .pick { position:relative; display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .pick input { position:absolute; left:0; top:0; width:100%; height:100%; opacity:0; border:0; padding:0; }
  .past { background:var(--amber-soft); color:var(--amber); border-radius:10px; padding:8px 12px; margin:6px 0; font-size:15px; font-weight:700; text-align:center; }
  .undo { margin-left:8px; height:36px; padding:0 14px; border-radius:10px; border:1px solid currentColor; background:#fff; color:inherit; font-weight:800; font-size:15px; }
  .meta { text-align:center; color:var(--mute); font-size:14px; margin-bottom:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; }
  .card h3 { margin:0 0 8px; font-size:16px; color:var(--mute); font-weight:800; display:flex; justify-content:space-between; align-items:center; }
  .ord { border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0; background:#fbfcfb; }
  .ord .r1 { display:grid; grid-template-columns: 1.2fr 1fr 0.8fr 36px; gap:6px; align-items:end; }
  .ord .r2 { display:grid; grid-template-columns: minmax(0,1fr) auto 10px minmax(0,1fr) auto; gap:5px; align-items:center; margin-top:8px; }
  .ord .r1 > *, .ord .r2 > * { min-width:0; }   /* 좁은 휴대폰에서 [끝] 버튼이 밖으로 밀리지 않게 */
  .tw:empty { display:none; }
  .tw { margin-top:6px; background:var(--amber-soft); color:var(--amber); border-radius:8px; padding:6px 8px; font-size:14px; font-weight:700; }
  .lab { font-size:12px; color:var(--mute); font-weight:700; display:block; margin-bottom:2px; }
  input, select, textarea { width:100%; height:46px; font-size:18px; padding:4px 8px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-family:inherit; }
  input[type=number] { text-align:center; font-weight:700; }
  input[type=time] { font-size:15px; padding:2px 2px; min-width:0; text-align:center; }
  input[type=time]::-webkit-calendar-picker-indicator { display:none; }   /* 시계 그림이 자리를 차지해 시각이 잘림 → 숨김(누르면 휴대폰 시간 고르기가 뜸) */
  textarea { height:84px; font-size:16px; }
  .now { height:46px; padding:0 8px; white-space:nowrap; border-radius:10px; border:1px solid var(--go); background:var(--go-soft); color:var(--go); font-weight:800; font-size:14px; }
  .del { height:46px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--red); font-size:20px; }
  .add { width:100%; height:50px; border-radius:12px; border:2px dashed var(--go); background:#fff; color:var(--go); font-weight:800; font-size:17px; margin-top:4px; }
  .g4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .g3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .sum { background:var(--go-soft); color:var(--go); border-radius:12px; padding:10px 12px; font-weight:800; margin:10px 0; font-size:16px; }
  .warn { background:var(--amber-soft); color:var(--amber); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:15px; font-weight:700; }
  .err { background:var(--red-soft); color:var(--red); border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:700; }
  .ok { background:var(--go-soft); color:var(--go); border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:800; }
  .muted { color:var(--mute); font-size:14px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:8px 12px; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .bar .st { flex:1; font-size:14px; color:var(--mute); font-weight:700; }
  .bar button { height:50px; padding:0 22px; border-radius:12px; border:0; background:var(--go); color:#fff; font-size:18px; font-weight:800; }
  .big { display:block; width:100%; min-height:56px; margin:10px 0; border-radius:14px; border:0; background:var(--go); color:#fff; font-size:19px; font-weight:800; }
</style>
</head>
<body>
<div id="banner" class="hide"></div>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>
<div class="bar" id="bar" style="display:none"><div class="in"><div class="st" id="st"></div><button onclick="save(true)">저장</button></div></div>

<script src="config.js"></script>
<script>
/* 메디포스트 휴대폰 업무일지 (GitHub Pages) — 2026-11-09 Claude Code
 * 종이 업무일지 칸을 휴대폰으로 같이 채움 → 구글 시트 [업무일지] (config.js apiUrl, 휴대폰 재고이동과 같은 웹앱·PIN)
 * 고치면 2.5초 뒤(또는 [저장]) '바꾼 칸만' 보내고 구글이 지금 내용에 합침 → 여러 명이 동시에 써도 서로 안 덮어씀.
 * 인터넷이 끊기면 휴대폰에 남았다가 연결되면 보냄. 사무실 업무허브가 데일리 리포트 카드로 가져감. */
var VERSION = '2026-11-09d';
var CFG = window.MEDI_MOVE_CONFIG || {};
var KINDS = ['건기식', '제대혈', '제대조직'];
var BOXES = ['1호', '2호', '3호', '4호', '6호', '7호', '8호', '기타'];
var MRO = ['종이 완충제', '종이 테이프', '투명 테이프'];
var WORKERS = ['직원', '휴가자', '알바'];
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function lsJson(k, d) { try { var v = JSON.parse(lsGet(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function pad(x) { return (x < 10 ? '0' : '') + x; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hm(d) { d = d || new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function num(v) { if (v === '' || v == null) return null; var n = parseInt(String(v).replace(/,/g, ''), 10); return isNaN(n) || n < 0 ? null : n; }
function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

var W = { worker: lsGet('mm_worker'), pin: lsGet('mm_pin') };   // 휴대폰 재고이동과 같이 씀
var D = { date: (function () { try { var q = new URLSearchParams(location.search).get('date'); if (/^\d{4}-\d\d-\d\d$/.test(q || '')) return q; } catch (e) {} return ymd(new Date()); })(),
          base: null, cur: null, rev: 0, by: '', at: '', fresh: false, sending: false, msg: null, view: 'main' };

function emptyDoc(date) {
  var b = {}, m = {}, w = {};
  BOXES.forEach(function (k) { b[k] = null; }); MRO.forEach(function (k) { m[k] = null; }); WORKERS.forEach(function (k) { w[k] = ''; });
  return { date: date, orders: [], add: null, total: null, boxes: b, box_total: null, mro: m, memo: '', workers: w };
}
function norm(doc, date) {   // 구글에서 온 내용을 빠진 칸 없이
  var e = emptyDoc(date);
  if (!doc) return e;
  e.orders = (doc.orders || []).map(function (o) { return { id: o.id || rid(), kind: o.kind || '건기식', count: o.count == null ? null : o.count, start: o.start || '', end: o.end || '', cancel: o.cancel == null ? null : o.cancel }; });
  ['add', 'total', 'box_total'].forEach(function (k) { e[k] = doc[k] == null ? null : doc[k]; });
  BOXES.forEach(function (k) { e.boxes[k] = (doc.boxes || {})[k] == null ? null : doc.boxes[k]; });
  MRO.forEach(function (k) { e.mro[k] = (doc.mro || {})[k] == null ? null : doc.mro[k]; });
  WORKERS.forEach(function (k) { e.workers[k] = (doc.workers || {})[k] || ''; });
  e.memo = doc.memo || '';
  return e;
}

// ---------------------------------------------------------------- 바꾼 칸만 (patch) — 구글 Code.gs diarySave_와 같은 규칙
function diff(a, b) {
  var set = {}, up = [], del = [];
  ['add', 'total', 'box_total', 'memo'].forEach(function (k) { if (a[k] !== b[k]) set[k] = b[k]; });
  BOXES.forEach(function (k) { if (a.boxes[k] !== b.boxes[k]) set['boxes.' + k] = b.boxes[k]; });
  MRO.forEach(function (k) { if (a.mro[k] !== b.mro[k]) set['mro.' + k] = b.mro[k]; });
  WORKERS.forEach(function (k) { if (a.workers[k] !== b.workers[k]) set['workers.' + k] = b.workers[k]; });
  var ai = {}; a.orders.forEach(function (o) { ai[o.id] = JSON.stringify(o); });
  var bi = {}; b.orders.forEach(function (o) { bi[o.id] = 1; if (ai[o.id] !== JSON.stringify(o)) up.push(o); });
  a.orders.forEach(function (o) { if (!bi[o.id]) del.push(o.id); });
  var p = {};
  if (Object.keys(set).length) p.set = set;
  if (up.length || del.length) p.orders = { upsert: up, del: del };
  return p;
}
function empty(p) { return !p.set && !p.orders; }
function apply(doc, p) {
  doc = clone(doc);
  Object.keys(p.set || {}).forEach(function (k) {
    var dot = k.indexOf('.');
    if (dot > 0) doc[k.slice(0, dot)][k.slice(dot + 1)] = p.set[k]; else doc[k] = p.set[k];
  });
  var o = p.orders || {};
  (o.del || []).forEach(function (id) { doc.orders = doc.orders.filter(function (x) { return x.id !== id; }); });
  (o.upsert || []).forEach(function (x) {
    var i = doc.orders.findIndex(function (y) { return y.id === x.id; });
    if (i >= 0) doc.orders[i] = clone(x); else doc.orders.push(clone(x));
  });
  return doc;
}

// ---------------------------------------------------------------- 합계
function totals(doc) {
  var by = {}; KINDS.forEach(function (k) { by[k] = 0; });
  var osum = 0;
  doc.orders.forEach(function (o) { var c = o.count || 0; osum += c; by[o.kind] = (by[o.kind] || 0) + c; });
  var total = osum + (doc.add || 0);
  var bsum = 0; BOXES.forEach(function (k) { bsum += doc.boxes[k] || 0; });
  return { by: by, osum: osum, total: total, bsum: bsum };
}
function fixTotals(doc) {   // 합계수량·박스 합계는 자동
  var t = totals(doc);
  doc.total = doc.orders.length || doc.add ? t.total : null;
  doc.box_total = t.bsum || null;
  return doc;
}

// ---------------------------------------------------------------- 휴대폰에 적어 두기
function dkey(date) { return 'mm_diary_' + date; }
function keep() { lsSet(dkey(D.date), JSON.stringify({ base: D.base, cur: D.cur, rev: D.rev, by: D.by, at: D.at })); }
function dirty() { return D.base && D.cur && !empty(diff(D.base, D.cur)); }

// ---------------------------------------------------------------- 구글
function api(action, extra, keepalive) {
  if (!CFG.apiUrl) return Promise.reject({ code: 'setup', message: 'config.js에 구글 웹앱 주소가 없어요' });
  var body = JSON.stringify(Object.assign({ action: action, pin: W.pin }, extra || {}));
  var attempt = 0;
  function once() {
    return fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow', keepalive: !!keepalive })
      .then(function (r) { if (!r.ok) throw { code: 'network', message: 'HTTP ' + r.status }; return r.json(); }, function () { throw { code: 'network', message: '인터넷 연결을 확인해 주세요' }; })
      .then(function (j) {
        if (!j.ok) throw { code: j.error === 'pin' ? 'pin' : 'server', message: j.error || '오류' };
        if (j.kind !== action) throw { code: 'network', message: '구글 응답이 이상해요' };
        return j;
      });
  }
  function loop() { return once().catch(function (e) { if (e.code !== 'network' || ++attempt >= 3) throw e; return new Promise(function (r) { setTimeout(r, 600 * attempt); }).then(loop); }); }
  return loop();
}
function pinFail() { W.pin = ''; lsSet('mm_pin', null); D.msg = { t: 'err', s: '현장 비밀번호가 맞지 않아요. 사무실에 물어보세요' }; D.view = 'who'; render(); }

function openDay(date) {
  D.date = date; D.fresh = false; D.msg = null; D.undo = null;
  var k = lsJson(dkey(date), null);
  if (k && k.base) { D.base = norm(k.base, date); D.cur = norm(k.cur, date); D.rev = k.rev || 0; D.by = k.by || ''; D.at = k.at || ''; }
  else { D.base = null; D.cur = null; D.rev = 0; D.by = ''; D.at = ''; }
  try { history.replaceState(null, '', '?date=' + date); } catch (e) {}
  render(); load();
}
function load() {
  if (!W.worker || !W.pin) { D.view = 'who'; render(); return; }
  var date = D.date;
  api('diaryGet', { date: date }).then(function (j) {
    if (date !== D.date) return;
    var server = norm(j.doc, date);
    if (dirty()) { var mine = diff(D.base, D.cur); D.cur = apply(server, mine); }   // 내가 고친 칸은 남기고 다른 사람 것을 합침
    else D.cur = clone(server);
    D.base = server; D.rev = j.rev; D.by = j.by; D.at = j.at; D.fresh = true;
    keep(); softRender();
    if (dirty()) save(false);
  }).catch(function (e) {
    if (e.code === 'pin') return pinFail();
    if (!D.base) { D.base = emptyDoc(date); D.cur = emptyDoc(date); D.msg = { t: 'warn', s: '인터넷이 안 돼서 빈 일지로 열었어요. 쓰면 휴대폰에 저장했다가 연결되면 합쳐서 보내요.' }; }
    render();
  });
}

var sendT = null, failN = 0;
function later() { clearTimeout(sendT); sendT = setTimeout(function () { save(false); }, 2500); }
function save(clicked, keepalive) {
  clearTimeout(sendT);
  if (!D.cur) return;
  fixTotals(D.cur); keep();
  if (!dirty()) { if (clicked) { D.msg = { t: 'ok', s: '✓ 바뀐 것 없이 모두 보냈어요' }; render(); } status(); return; }
  if (D.sending) { sendT = setTimeout(function () { save(false); }, 800); return; }
  var date = D.date, sent = clone(D.cur), p = diff(D.base, sent);
  D.sending = true; status();
  api('diarySave', { date: date, patch: p, worker: W.worker }, keepalive).then(function (j) {
    D.sending = false; failN = 0;
    if (date !== D.date) return;
    var server = norm(j.doc, date);
    var after = diff(sent, D.cur);                 // 보내는 동안 더 고친 것
    D.base = server; D.cur = empty(after) ? clone(server) : apply(server, after);
    D.rev = j.rev; D.by = j.by; D.at = j.at; D.fresh = true;
    if (clicked) D.msg = { t: 'ok', s: '✓ 저장했어요 (' + String(j.at).slice(11, 16) + ')' };
    keep();
    if (clicked || JSON.stringify(server) !== JSON.stringify(fixTotals(clone(sent)))) softRender(); else { chk(); status(); }
    if (!empty(after)) later();
  }).catch(function (e) {
    D.sending = false;
    if (e.code === 'pin') return pinFail();
    if (e.code === 'server') { D.msg = { t: 'err', s: '구글이 받지 않았어요: ' + e.message }; render(); return; }
    failN++; sendT = setTimeout(function () { save(false); }, Math.min(30000, 3000 * failN));
    if (clicked) { D.msg = { t: 'warn', s: '휴대폰에 저장했어요. 인터넷이 되면 저절로 보내요.' }; render(); } else status();
  });
}
window.addEventListener('online', function () { failN = 0; if (dirty()) save(false); else load(); });
window.addEventListener('pagehide', function () { if (dirty()) save(false, true); });
document.addEventListener('visibilitychange', function () { if (document.hidden) { if (dirty()) save(false, true); } else load(); });

// ---------------------------------------------------------------- 화면
function status() {
  var b = $('banner'), st = $('st');
  var d = dirty();
  if (st) st.textContent = D.sending ? '보내는 중…' : d ? (failN ? '📶 휴대폰에 저장됨 · 연결되면 보내요' : '고친 내용 있음 · 곧 보내요') : (D.at ? '✓ 보냄 · ' + D.by + ' ' + String(D.at).slice(11, 16) : '아직 아무도 안 썼어요');
  if (b) {
    if (!CFG.apiUrl) { b.className = ''; b.textContent = '설정 전: config.js에 구글 웹앱 주소가 없어요'; }
    else if (d && (failN || !D.fresh)) { b.className = ''; b.textContent = '📶 아직 못 보낸 고친 내용이 있어요 — 휴대폰에 저장돼 있고 인터넷이 되면 보내요'; }
    else if (!D.fresh && D.base) { b.className = ''; b.textContent = '인터넷 없이 휴대폰에 저장된 일지를 보고 있어요'; }
    else { b.className = 'hide'; b.textContent = ''; }
  }
}
function render() {
  var h = '<div class="top"><div class="ttl">📝 업무일지</div><div class="who">' + (W.worker ? esc(W.worker) + ' · <a href="#" onclick="D.view=\'who\';render();return false">바꾸기</a><br>' : '') +
    '<a class="lnk" href="./">재고이동 →</a></div></div>';
  if (D.msg) h += '<div class="' + D.msg.t + '">' + esc(D.msg.s) + (D.msg.undo && D.undo && D.undo.date === D.date ? '<button class="undo" onclick="undo()">↩ 되돌리기</button>' : '') + '</div>';
  if (D.view === 'who') { $('app').innerHTML = h + viewWho(); $('bar').style.display = 'none'; status(); return; }
  var today = ymd(new Date());
  // 날짜: ◀▶ 하루씩, 가운데 날짜를 누르면 달력에서 고르기 (2026-11-09 "언제든 수정하고 관리")
  h += '<div class="day"><button onclick="shift(-1)">◀</button><label class="pick"><b>' + mdLabel(D.date) + '</b><span>📅</span>' +
    '<input type="date" value="' + D.date + '" max="' + today + '" onclick="try{this.showPicker()}catch(e){}" onchange="pickDay(this.value)"></label>' +
    '<button onclick="shift(1)"' + (D.date >= today ? ' disabled' : '') + '>▶</button></div>';
  if (D.date !== today) h += '<div class="past">지난 날짜 일지예요 · 고치거나 지우면 그대로 저장되고 사무실 허브에도 들어가요 · <a class="lnk" href="#" onclick="openDay(ymd(new Date()));return false">오늘로</a></div>';
  h += '<div class="meta">' + (D.at ? '마지막으로 고친 사람: ' + esc(D.by) + ' · ' + esc(String(D.at).slice(5, 16)) : '아직 아무도 안 썼어요') + ' · 날짜를 누르면 달력</div>';
  if (!D.cur) { $('app').innerHTML = h + '<p class="muted">불러오는 중…</p>'; $('bar').style.display = 'none'; status(); return; }
  var c = D.cur;
  // 오더
  h += '<div class="card"><h3>오더 · 건수 · 작업시간 <span class="muted">차수마다 한 줄</span></h3>';
  if (!c.orders.length) h += '<div class="muted">차수가 끝나면 [+ 오더 줄]을 눌러 넣어 주세요.</div>';
  c.orders.forEach(function (o, i) {
    h += '<div class="ord"><div class="r1">' +
      '<label><span class="lab">오더</span><select onchange="setO(' + i + ',\'kind\',this.value)">' + KINDS.map(function (k) { return '<option' + (o.kind === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></label>' +
      '<label><span class="lab">건수(취소 빼고)</span><input type="number" inputmode="numeric" value="' + (o.count == null ? '' : o.count) + '" oninput="setO(' + i + ',\'count\',num(this.value))"></label>' +
      '<label><span class="lab">취소</span><input type="number" inputmode="numeric" value="' + (o.cancel == null ? '' : o.cancel) + '" oninput="setO(' + i + ',\'cancel\',num(this.value))"></label>' +
      '<button class="del" title="이 줄 지우기" onclick="delO(' + i + ')">×</button></div>' +
      '<div class="r2"><input type="time" value="' + esc(o.start) + '" onchange="setO(' + i + ',\'start\',this.value)"><button class="now" onclick="nowO(' + i + ',\'start\')">시작</button>' +
      '<span>~</span><input type="time" value="' + esc(o.end) + '" onchange="setO(' + i + ',\'end\',this.value)"><button class="now" onclick="nowO(' + i + ',\'end\')">끝</button></div>' +
      '<div class="tw" id="tw' + i + '"></div></div>';
  });
  h += '<button class="add" onclick="addO()">+ 오더 줄</button>';
  h += '<div style="margin-top:10px"><label><span class="lab">추송 건수</span><input type="number" inputmode="numeric" value="' + (c.add == null ? '' : c.add) + '" oninput="setF(\'add\',num(this.value))"></label></div>';
  h += '</div>';
  // 박스
  h += '<div class="card"><h3>출고 박스 수량</h3><div class="g4">';
  BOXES.forEach(function (k) { h += '<label><span class="lab">' + k + '</span><input type="number" inputmode="numeric" value="' + (c.boxes[k] == null ? '' : c.boxes[k]) + '" oninput="setG(\'boxes\',\'' + k + '\',num(this.value))"></label>'; });
  h += '</div></div>';
  h += '<div id="chk"></div>';
  // 부자재
  h += '<div class="card"><h3>부자재 사용수량</h3><div class="g3">';
  MRO.forEach(function (k) { h += '<label><span class="lab">' + k + '</span><input type="number" inputmode="numeric" value="' + (c.mro[k] == null ? '' : c.mro[k]) + '" oninput="setG(\'mro\',\'' + k + '\',num(this.value))"></label>'; });
  h += '</div></div>';
  // 특이사항·근무
  h += '<div class="card"><h3>특이사항</h3><textarea oninput="setF(\'memo\',this.value)" placeholder="없으면 비워 두기">' + esc(c.memo) + '</textarea></div>';
  h += '<div class="card"><h3>근무현황</h3><div class="g3">';
  WORKERS.forEach(function (k) { h += '<label><span class="lab">' + k + '</span><input type="text" value="' + esc(c.workers[k]) + '" oninput="setG(\'workers\',\'' + k + '\',this.value)"></label>'; });
  h += '</div></div>';
  // 11/9 김문수 님 "모두 지우기는 위험해 보인다, 수정할 수 있으니 없애줘" → 하루 전체 지우기 버튼은 없음. 칸·줄 단위로만 고치고 지움
  h += '<div class="card"><h3>고치기 · 지우기</h3><div class="muted">칸을 고치면 2.5초 뒤 저절로 저장돼요(지난 날짜도). 잘못 쓴 숫자는 지우면 빈 칸, 오더 줄은 ×로 지워요. 줄을 지운 바로 뒤에는 [↩ 되돌리기]로 살릴 수 있어요.</div></div>';
  h += '<div class="foot muted" style="text-align:center;margin-top:16px">메디포스트 업무일지 · ' + VERSION + ' · 쓰면 저절로 보내져요</div>';
  $('app').innerHTML = h; $('bar').style.display = '';
  chk(); status();
}
function chk() {
  var el = $('chk'); if (!el || !D.cur) return;
  var t = totals(D.cur), c = D.cur, parts = KINDS.filter(function (k) { return t.by[k]; }).map(function (k) { return k + ' ' + t.by[k]; });
  if (c.add) parts.push('추송 ' + c.add);
  var h = '<div class="sum">합계수량 ' + t.total + '건' + (parts.length ? ' (' + parts.join(' · ') + ')' : '') + ' · 박스 합계 ' + t.bsum + '</div>';
  if (t.bsum && t.total && t.bsum !== t.total) h += '<div class="warn">박스 합계 ' + t.bsum + ' ≠ 합계수량 ' + t.total + ' — 다시 세어 보기</div>';
  var bad = 0;
  c.orders.forEach(function (o, i) {
    var w = timeWarn(o), e = $('tw' + i);
    if (w) bad++;
    if (e) e.innerHTML = w ? '⚠ ' + esc(w) : '';
  });
  if (bad) h += '<div class="warn">작업시간 확인 필요 ' + bad + '줄 — 위 노란 줄을 봐 주세요 ([시작]/[끝] 버튼을 누르면 지금 시각이 들어가요)</div>';
  el.innerHTML = h;
}
// 11/9 첫 시험에서 시작이 23:50으로 들어감(시간 칸 오전/오후 헷갈림) → 이상한 시간은 노랗게
function mins(t) { var m = /^(\d{1,2}):(\d\d)$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function timeWarn(o) {
  var s = mins(o.start), e = mins(o.end), out = [];
  [['시작', s, o.start], ['끝', e, o.end]].forEach(function (x) {
    if (x[1] != null && (x[1] < 6 * 60 || x[1] >= 22 * 60)) out.push(x[0] + ' ' + x[2] + '이 근무 시간 밖이에요 — 오전/오후 확인');
  });
  if (s != null && e != null && e < s) out.push('끝(' + o.end + ')이 시작(' + o.start + ')보다 빨라요');
  return out.join(' · ');
}
// 입력 칸에서 글을 쓰는 중에는 화면을 다시 그리지 않음(글자·커서가 날아가지 않게) → 칸을 벗어나면 그림
function typing() { var a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('app').contains(a); }
function softRender() { if (typing()) { D.needRender = true; chk(); status(); } else render(); }
document.addEventListener('focusout', function () { setTimeout(function () { if (D.needRender && !typing()) { D.needRender = false; render(); } }, 50); });
setInterval(function () { if (D.needRender && !typing()) { D.needRender = false; render(); } }, 2000);   // focusout이 안 오는 경우 대비
function touch(rerender) { fixTotals(D.cur); keep(); later(); if (rerender) render(); else { chk(); status(); } }
function setF(k, v) { D.cur[k] = v; touch(false); }
function setG(g, k, v) { D.cur[g][k] = v; touch(false); }
function setO(i, k, v) { D.cur.orders[i][k] = v; touch(false); }
function nowO(i, k) { D.cur.orders[i][k] = hm(); touch(true); }
function addO() { var last = D.cur.orders[D.cur.orders.length - 1]; D.cur.orders.push({ id: rid(), kind: last ? last.kind : '건기식', count: null, start: '', end: '', cancel: null }); touch(true); }
function oName(o) { return (o.kind || '') + ' ' + (o.count == null ? '' : o.count + '건 ') + '줄'; }
function delO(i) {
  var o = D.cur.orders[i]; if (!confirm(oName(o) + '을 지울까요?')) return;
  D.undo = { date: D.date, kind: 'row', row: clone(o), index: i };
  D.cur.orders.splice(i, 1);
  D.msg = { t: 'ok', s: '🗑 ' + oName(o) + '을 지웠어요', undo: true };
  touch(true);
}
function mdLabel(date) { var d = new Date(date + 'T00:00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')'; }
function undo() {   // 오더 줄 지운 것 되돌리기
  var u = D.undo;
  if (!u || u.date !== D.date || !D.cur) return;
  if (!D.cur.orders.some(function (o) { return o.id === u.row.id; })) {
    // 구글은 새 줄을 맨 끝에 붙이므로, 뒤에 있던 줄들을 새 번호로 다시 보내 원래 자리(차수 순서)를 지킴
    var at = Math.min(u.index, D.cur.orders.length);
    var after = D.cur.orders.slice(at).map(function (o) { var x = clone(o); x.id = rid(); return x; });
    D.cur.orders = D.cur.orders.slice(0, at).concat([clone(u.row)], after);
  }
  D.undo = null;
  D.msg = { t: 'ok', s: '↩ 되돌렸어요' };
  touch(true); save(false);
}
function shift(n) { var d = new Date(D.date + 'T00:00:00'); d.setDate(d.getDate() + n); pickDay(ymd(d)); }
function pickDay(v) {
  if (!/^\d{4}-\d\d-\d\d$/.test(v || '') || v === D.date) return;
  if (v > ymd(new Date())) { D.msg = { t: 'warn', s: '앞으로 올 날짜의 일지는 쓸 수 없어요' }; render(); return; }
  if (dirty()) save(false);
  openDay(v);
}

function viewWho() {
  return '<div class="card"><h3>처음 한 번만 넣어요</h3><p>이름</p><input type="text" id="wName" value="' + esc(W.worker) + '" placeholder="예: 홍길동">' +
    '<p>현장 비밀번호 (사무실에 물어보기)</p><input type="password" inputmode="numeric" id="wPin" placeholder="••••">' +
    '<button class="big" onclick="saveWho()">시작</button><div class="muted">휴대폰 재고이동과 같은 비밀번호예요. 이 휴대폰에만 저장돼요.</div></div>';
}
function saveWho() {
  var w = $('wName').value.trim(), pin = $('wPin').value.trim();
  if (!w) { D.msg = { t: 'err', s: '이름을 넣어 주세요' }; render(); return; }
  if (!pin && !W.pin) { D.msg = { t: 'err', s: '현장 비밀번호를 넣어 주세요' }; render(); return; }
  W.worker = w; lsSet('mm_worker', w);
  if (pin) { W.pin = pin; lsSet('mm_pin', pin); }
  D.msg = null; D.view = 'main'; render(); load();
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
openDay(D.date);
</script>
