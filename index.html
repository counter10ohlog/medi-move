<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>메디포스트 재고이동</title>
<style>
  /* 2026-11-13 김문수 님 "업무 허브랑 깔맞춤 · 누구든 쓰기 좋게 가독성 · 로케이션·제품명·LOT 잘 보이게"
     → 업무허브 밝은 테마 색 그대로(연한 회녹색 바탕 · 흰 카드 · 초록 #12804f · 알약 모양 표시 · 허브 로고).
     중요한 세 가지는 어느 화면에서나 같은 모양: 자리 = 초록 상자 굵은 글씨(.lc · 맨 위 큰 자리 .hero),
     제품명 = 크고 굵게(.pn), LOT = 파란 상자(.lot) + 유통기한 회색 상자(.exp). 작은 글자도 흰 바탕 대비 4.5:1 이상 */
  :root { --bg:#eef2f1; --card:#fff; --ink:#1f2d2a; --ink2:#4d5d59; --mute:#5f6f6b; --line:#dce4e1; --edge:#e1e8e5;
          --go:#12804f; --go-ink:#0f6e47; --go-soft:#e2f3ea; --go-line:#bfe3cf;
          --amber:#94600c; --amber-ink:#7a4f0a; --amber-soft:#fff3d6; --amber-line:#f0d8a0;
          --red:#c93c3c; --red-ink:#9b2c2c; --red-soft:#fdeaea; --red-line:#f3c4c4;
          --blue-ink:#1f4f9e; --blue-soft:#e8f0fc; --blue-line:#c9daf6; --gray-soft:#eef1f0;
          --sh:0 1px 2px rgba(20,40,35,.05),0 4px 14px rgba(20,40,35,.06); }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,"Noto Sans KR",sans-serif;
         word-break:keep-all; overflow-wrap:break-word; }   /* 한글은 띄어쓰기에서 줄바꿈 (낱글자로 안 끊김) */
  button { font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:520px; margin:0 auto; padding:0 14px 96px; }   /* 아래 안내 줄 자리를 늘 비워 둠 (11/12) */
  /* 위쪽 막대 — 업무허브 왼쪽 위와 같은 로고 */
  .bar { display:flex; align-items:center; gap:10px; margin:0 -14px 12px; padding:10px 14px; background:#fff; border-bottom:1px solid var(--line); }
  .bar svg { width:32px; height:32px; flex:none; }
  .bar .bt { flex:1; min-width:0; line-height:1.25; }
  .bar .bt b { display:block; font-size:16px; letter-spacing:-.3px; }
  .bar .bt small { display:block; font-size:12px; color:var(--mute); }
  .who { font-size:14px; color:var(--ink2); text-align:right; line-height:1.5; }
  .who b { color:var(--ink); }
  .who a { color:var(--blue-ink); font-weight:700; text-decoration:none; }
  /* 지금 자리 (QR로 연 자리) — 가장 크게 */
  .hero { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--edge); border-left:6px solid var(--go);
          border-radius:16px; box-shadow:var(--sh); padding:10px 16px 12px; margin:0 0 12px; }
  .hero .hl { flex:1; min-width:0; }
  .hero .hk { font-size:13px; font-weight:800; color:var(--mute); }
  .hero .hloc { font-size:50px; line-height:1.05; font-weight:900; letter-spacing:1px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hero .hnone { font-size:17px; font-weight:700; color:var(--ink2); margin-top:2px; }
  .hero .hr { text-align:right; font-size:15px; font-weight:700; color:var(--ink2); line-height:1.6; }
  .hero .full { display:block; font-size:12.5px; font-weight:600; color:var(--mute); }
  .lv { display:inline-flex; align-items:center; padding:1px 12px; border-radius:999px; font-size:16px; font-weight:900; background:var(--gray-soft); color:var(--ink2); border:1px solid var(--line); }
  .lv.l1 { background:var(--go-soft); color:var(--go-ink); border-color:var(--go-line); }
  /* 카드 */
  .card { background:var(--card); border:1px solid var(--edge); border-radius:16px; box-shadow:var(--sh); padding:14px 16px; margin:12px 0; }
  .card.hot { border:2px solid var(--go); }
  .card.mine.un { border:2px solid var(--amber); }
  .card h3 { margin:0 0 8px; font-size:16px; color:var(--ink2); font-weight:800; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card h3 .when { font-weight:600; font-size:13px; color:var(--mute); }
  .card h3 .lc { font-size:16px; }
  .card p { margin:14px 0 6px; font-size:16px; font-weight:700; color:var(--ink2); }
  details.card summary { font-size:15px; font-weight:700; color:var(--ink2); padding:4px 0; }
  /* 중요한 것: 자리 · 제품명 · LOT */
  .lc { display:inline-block; padding:0 8px; border-radius:8px; background:var(--go-soft); color:var(--go-ink); border:1px solid var(--go-line);
        font-weight:900; letter-spacing:.3px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lc.pk { background:var(--gray-soft); color:var(--ink); border-color:var(--line); font-weight:800; }
  .lc.xl { font-size:26px; padding:1px 12px; border-radius:10px; }
  .prod { padding:12px 0 10px; border-top:1px solid var(--line); }
  .prod:first-of-type { border-top:0; padding-top:2px; }
  .pn { font-size:21px; font-weight:800; line-height:1.3; color:var(--ink); word-break:keep-all; overflow-wrap:anywhere; }
  .pc { font-size:13px; font-weight:700; color:var(--mute); letter-spacing:.3px; }
  .ids { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .lot, .exp { display:inline-flex; align-items:baseline; gap:6px; padding:2px 10px; border-radius:9px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lot { background:var(--blue-soft); border:1px solid var(--blue-line); color:var(--blue-ink); font-size:20px; font-weight:900; letter-spacing:.5px; }
  .exp { background:var(--gray-soft); border:1px solid var(--line); color:var(--ink); font-size:16px; font-weight:700; }
  .lot i, .exp i { font-style:normal; font-size:12px; font-weight:800; letter-spacing:0; }
  .exp i { color:var(--ink2); }
  .qty { font-size:16px; color:var(--ink2); margin-top:6px; }
  .qty b { font-size:24px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums; }
  /* 큰 버튼 (업무허브 초록 버튼과 같은 색) */
  .big { display:flex; align-items:center; gap:12px; width:100%; min-height:62px; margin:10px 0; padding:12px 16px; border-radius:14px; border:0;
         background:linear-gradient(90deg,#16915b,#12804f); color:#fff; font-size:19px; font-weight:800; line-height:1.3; text-align:left; box-shadow:0 4px 12px rgba(18,128,79,.22); }
  .big .ic { flex:none; width:30px; font-size:24px; text-align:center; }
  .big .bx { flex:1; min-width:0; }
  .big small { display:block; font-size:14px; font-weight:600; opacity:.9; margin-top:1px; }
  .big.alt { background:#fff; color:var(--go-ink); border:1.5px solid var(--go-line); box-shadow:var(--sh); }
  .big.alt small { color:var(--ink2); opacity:1; }
  .big.gray { background:#fff; color:var(--ink2); border:1.5px solid #d3ddd9; box-shadow:none; font-size:17px; min-height:54px; }
  .big:active { transform:translateY(1px); filter:brightness(.97); }
  button.small { min-height:44px; padding:6px 14px; border-radius:10px; border:1px solid #d3ddd9; background:#fff; font-size:15px; font-weight:700; color:var(--ink); }
  .step { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .step button { width:60px; height:60px; border-radius:14px; border:1.5px solid #d3ddd9; background:#fff; font-size:30px; font-weight:800; color:var(--ink); }
  .step input[type=number] { width:120px; flex:none; height:60px; padding:0; text-align:center; font-size:30px; font-weight:900; border:2px solid var(--go-line); border-radius:14px; color:var(--ink); background:#fff; }
  .step span { font-size:18px; font-weight:700; }
  input[type=text], input[type=number], input[type=password], select { width:100%; height:54px; font-size:19px; padding:6px 12px; border:1.5px solid #cfd9d5; border-radius:12px; background:#fff; color:var(--ink); font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--go); box-shadow:0 0 0 3px var(--go-soft); }
  label.chk { display:flex; gap:12px; align-items:center; padding:14px; border:1.5px solid #cfd9d5; border-radius:12px; margin:12px 0; font-weight:800; background:#fff; }
  label.chk input { width:26px; height:26px; accent-color:var(--red); }
  label.chk.on { border-color:var(--red); background:var(--red-soft); color:var(--red-ink); }
  .cand { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:1.5px solid var(--line); border-radius:14px; background:#fff; font-size:16px; color:var(--ink); }
  .cand.sel { border:2px solid var(--go); background:var(--go-soft); box-shadow:0 0 0 3px rgba(18,128,79,.12); }
  .cand .ch { display:flex; align-items:center; gap:4px 8px; flex-wrap:wrap; }
  .cand .cq { font-size:16px; color:var(--ink2); }
  .cand .cq b { font-size:20px; color:var(--ink); font-weight:900; font-variant-numeric:tabular-nums; }
  /* 출발 → 도착 */
  .route { display:flex; align-items:stretch; gap:8px; margin:4px 0 10px; }
  .route .rb { flex:1; min-width:0; text-align:center; border:1.5px solid var(--line); border-radius:14px; padding:8px 6px; background:#f7faf9; }
  .route .rb small { display:block; font-size:13px; font-weight:800; color:var(--mute); }
  .route .rb b { display:block; font-size:34px; font-weight:900; letter-spacing:.5px; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .route .rb span { font-size:14px; font-weight:700; color:var(--ink2); }
  .route .rb.to { border:2px solid var(--go); background:var(--go-soft); }
  .route .rb.to b { color:var(--go-ink); }
  .route .rb.q b { color:var(--mute); }
  .route .ra { align-self:center; font-size:28px; font-weight:900; color:var(--go); }
  /* 안내 상자 */
  .sum { background:var(--go-soft); color:var(--go-ink); border:1px solid var(--go-line); border-radius:12px; padding:10px 14px; margin:10px 0; font-weight:800; font-size:18px; }
  .warn { background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber-line); border-radius:12px; padding:10px 14px; margin:10px 0; font-size:15px; }
  .warn .pb { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .err { background:var(--red-soft); color:var(--red-ink); border:1px solid var(--red-line); border-radius:12px; padding:10px 14px; margin:10px 0; font-weight:700; }
  .ok { background:var(--go-soft); color:var(--go-ink); border:1px solid var(--go-line); border-radius:12px; padding:12px 14px; margin:10px 0; font-weight:800; font-size:18px; }
  .muted, .sub { color:var(--mute); font-size:14px; }
  .card p.sub { font-weight:600; font-size:14px; color:var(--mute); }
  /* 알약 표시 (업무허브 .pill 과 같은 모양) — 안내 상자보다 뒤에 두어 크기가 덮이지 않게 */
  .tag { display:inline-flex; align-items:center; margin:0 0 0 6px; padding:1px 9px; border-radius:999px; font-size:12.5px; font-weight:800; line-height:1.6; white-space:nowrap; vertical-align:2px;
         background:var(--go-soft); color:var(--go-ink); border:1px solid var(--go-line); }
  .tag.warn { background:var(--amber-soft); color:var(--amber-ink); border-color:var(--amber-line); }
  .tag.wait { background:var(--gray-soft); color:#56645f; border-color:#dbe2df; }
  .tag.bad { background:var(--red-soft); color:var(--red-ink); border-color:var(--red-line); }
  /* 기록 줄 */
  .rec { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .rec:first-of-type { border-top:0; }
  .rec .rm { flex:1; min-width:0; }
  .rec .rt { font-size:16px; font-weight:800; line-height:1.4; }
  .rec .tm { font-size:14px; font-weight:700; color:var(--mute); margin-right:6px; font-variant-numeric:tabular-nums; }
  .rec .rw { font-size:15px; color:var(--ink2); margin-top:4px; line-height:1.7; }
  .rec .rw .lc { font-size:15px; }
  .rec.cx { opacity:.55; }
  .rec.cx .rt, .rec.cx .rw { text-decoration:line-through; }
  .grid4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .grid4 button { height:56px; font-size:21px; font-weight:900; border-radius:12px; border:1.5px solid #d3ddd9; background:#fff; color:var(--ink); }
  .grid4 button.sel { border:2px solid var(--go); background:var(--go-soft); color:var(--go-ink); }
  .foot { margin-top:24px; text-align:center; color:var(--mute); font-size:12px; }
  /* 11/12 김문수 님 "QR 찍고 들어가면 노란 안내가 나오며 칸이 밀려 잘못 눌림 — 아래쪽에 나오거나 안 나오게"
     → 화면 맨 아래에 고정(내용을 밀지 않음), 불러오는 동안은 안 띄움 */
  #banner { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--amber-soft); color:var(--amber-ink); font-weight:800; font-size:15px;
            padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--amber-line); box-shadow:0 -2px 8px rgba(0,0,0,.06); }
  #banner.hide { display:none; }
  @media (max-width:360px) { .hero .hloc { font-size:42px; } .route .rb b { font-size:28px; } .pn { font-size:19px; } .big { font-size:18px; } }
</style>
</head>
<body>
<div id="banner" class="hide"></div>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>

<script src="config.js"></script>
<script>
/* 메디포스트 휴대폰 재고이동 (GitHub Pages) — 2026-11-06 Claude Code
 * 자리 QR(이 주소 ?loc=M1-09) → 그 자리에서 한 일 [저장] → 휴대폰에 먼저 적고(보관함) → 구글 웹앱(config.js apiUrl)으로 보냄.
 * 인터넷이 끊기면 보관함에 남았다가 연결되면 다시 보냄(3초 → 최대 30초). 같은 기록 ID는 구글에서 한 번만 들어감.
 * 받은 자료(재고·품목·오늘 기록)도 휴대폰에 저장해 두어, 끊긴 채 열어도 보인다. 화면 파일은 sw.js가 저장해 둔다. */
var VERSION = '2026-11-13b';
var CFG = window.MEDI_MOVE_CONFIG || {};
var ROWS = ['I', 'J', 'K', 'L', 'M', 'N', 'E'];
var K = { worker: 'mm_worker', pin: 'mm_pin', outbox: 'mm_outbox', cache: 'mm_cache', gone: 'mm_cancelled', pend: 'mm_pending_move' };
/* 2026-11-12 김문수 님 "Bulk에서 Bulk로 옮길 때 시작점 QR과 도착점 QR을 찍어서 바로 이동" →
 * 출발 자리 QR → [➡ 다른 자리로] → 품목 → [📷 넣은 자리 QR 찍기] → '옮기는 중'을 휴대폰에 10분 저장
 * → 휴대폰 카메라로 도착 자리 QR (화면이 새로 열림) → "출발 → 도착" 확인 → [저장]. 손으로 자리 넣기도 남김 */
var PEND_MIN = 10;
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function lsJson(k, d) { try { var v = JSON.parse(lsGet(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }

var LOC0 = (function () { try { return new URLSearchParams(location.search).get('loc') || ''; } catch (e) { return ''; } })();
var S = { data: lsJson(K.cache, null), fresh: false, loc: '', worker: lsGet(K.worker), pin: lsGet(K.pin), view: 'loc', form: null, msg: null };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(v) { return Number(v || 0).toLocaleString('ko-KR'); }
function $(id) { return document.getElementById(id); }
function pad(x) { return (x < 10 ? '0' : '') + x; }
function nowText(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function newId(d) { d = d || new Date(); return pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '-' + Math.random().toString(36).slice(2, 7).padEnd(5, '0'); }
function uniq(a) { var o = []; a.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }

function parseLoc(s) {
  s = String(s || '').toUpperCase().replace(/\s/g, '');
  var m = s.match(/^D2-([A-Z])(\d)-(\d{1,2})-00$/) || s.match(/^([A-Z])(\d)-(\d{1,2})$/);
  if (!m) return null;
  var bay = parseInt(m[3], 10), lv = parseInt(m[2], 10);
  if (!(bay >= 1 && bay <= 99)) return null;
  var b2 = (bay < 10 ? '0' : '') + bay;
  return { short: m[1] + lv + '-' + b2, full: 'D2-' + m[1] + lv + '-' + b2 + '-00', row: m[1], level: lv, bay: bay };
}
function shortOf(full) { var p = parseLoc(full); return p ? p.short : full; }
S.loc = (parseLoc(LOC0) || {}).short || '';

// ---- '옮기는 중' (출발 QR을 찍고 도착 QR을 기다림) — 이 휴대폰에만, 10분 지나면 저절로 지움
function pendGet() {
  var p = lsJson(K.pend, null);
  if (!p || !p.from || !p.code) return null;
  if (Date.now() - (p.at || 0) > PEND_MIN * 60000) { lsSet(K.pend, null); return null; }
  return p;
}
function pendSet(p) { lsSet(K.pend, p ? JSON.stringify(p) : null); }
function pendLeft(p) { return Math.max(0, Math.ceil((PEND_MIN * 60000 - (Date.now() - p.at)) / 60000)); }
// QR(또는 자리 고르기)로 이 자리가 열렸을 때 '옮기는 중'이면 → 출발과 다르면 확인 화면, 같으면 기다리는 화면
function pendRoute() {
  var pd = pendGet(), p = parseLoc(S.loc);
  if (!pd || !p) return;
  if (pd.from === p.full) { S.view = 'waitdest'; S.msg = { t: 'warn', s: '여기는 출발 자리예요. 파레트를 넣은 자리의 QR을 찍어 주세요' }; }
  else { S.view = 'confirmMove'; S.msg = null; }
}
pendRoute();

// ---------------------------------------------------------------- 구글 웹앱 부르기
// 구글 전달(리다이렉트)이 가끔 진짜 응답 대신 상태({ok, app})를 줄 때가 있어 kind를 보고 3번까지 다시 보냄 (dailylist와 같은 방식)
function api(action, extra, keepalive) {
  if (!CFG.apiUrl) return Promise.reject({ code: 'setup', message: 'config.js에 구글 웹앱 주소가 아직 없어요 (사무실에 알려 주세요)' });
  var body = JSON.stringify(Object.assign({ action: action, pin: S.pin }, extra || {}));
  var want = { phoneData: 'data', phoneSave: 'save', phoneCancel: 'cancel', phoneSend: 'send' }[action];
  var attempt = 0;
  function once() {
    return fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow', keepalive: !!keepalive })
      .then(function (r) { if (!r.ok) throw { code: 'network', message: 'HTTP ' + r.status }; return r.json(); }, function () { throw { code: 'network', message: '인터넷 연결을 확인해 주세요' }; })
      .then(function (j) {
        if (!j.ok) throw { code: j.error === 'pin' ? 'pin' : 'server', message: j.error || '오류' };
        if (j.kind !== want) throw { code: 'network', message: '구글 응답이 이상해요' };
        return j;
      });
  }
  function loop() {
    return once().catch(function (e) {
      if (e.code !== 'network' || ++attempt >= 3) throw e;
      return new Promise(function (r) { setTimeout(r, 600 * attempt); }).then(loop);
    });
  }
  return loop();
}
function pinFail() {
  S.pin = ''; lsSet(K.pin, null);
  S.msg = { t: 'err', s: '현장 비밀번호가 맞지 않아요. 사무실에 물어보세요' }; S.view = 'who'; render();
}

// ---------------------------------------------------------------- 받은 자료
function load() {
  if (!S.worker || !S.pin) { S.view = 'who'; render(); return; }
  api('phoneData').then(function (res) {
    S.data = { at: nowText(), today: res.today, stockTime: res.stockTime, stock: res.stock, items: res.items, log: res.log };
    S.fresh = true; S.loadFailed = false;
    mergeOutbox();
    lsSet(K.cache, JSON.stringify(S.data));
    if (S.view === 'who') S.view = 'loc';
    render(); flush(); sendIfWanted();
  }).catch(function (e) {
    if (e.code === 'pin') return pinFail();
    S.fresh = false; S.loadFailed = true;   // 받기에 실패했을 때만 '인터넷 없이 저장된 자료' 안내
    if (!S.data) S.msg = { t: 'err', s: '처음 한 번은 인터넷이 되는 곳에서 열어 주세요. (' + e.message + ')' };
    render();
  });
}

// ---------------------------------------------------------------- 보관함 (아직 구글에 못 보낸 기록)
var flushT = null, inflight = false, failStreak = 0;
function outbox() { return lsJson(K.outbox, []); }
function setOutbox(a) { lsSet(K.outbox, a.length ? JSON.stringify(a) : null); }
function flush(keepalive) {
  var box = outbox();
  banner();
  if (!box.length || inflight || !S.pin) return;
  inflight = true; clearTimeout(flushT); flushT = null;
  var ids = box.map(function (r) { return r.id; });
  api('phoneSave', { recs: box }, keepalive).then(function (j) {
    var gone = {};
    j.saved.forEach(function (id) { gone[id] = 'ok'; });
    j.bad.forEach(function (b) { gone[b.id] = b.error; });
    setOutbox(outbox().filter(function (r) { return !gone[r.id]; }));   // 보내는 동안 새로 저장한 것은 남김
    if (S.data) S.data.log.forEach(function (r) {
      if (gone[r.id] === 'ok' && r.status === '보내는 중') r.status = '새로';
      else if (gone[r.id] && gone[r.id] !== 'ok') { r.status = '안 들어감'; r.error = gone[r.id]; }
    });
    if (j.bad.length) S.msg = { t: 'err', s: '구글이 받지 않은 기록이 ' + j.bad.length + '건 있어요: ' + j.bad[0].error + ' — 다시 넣어 주세요' };
    failStreak = 0; saveCache();
  }).catch(function (e) {
    if (e.code === 'pin') { pinFail(); return; }
    failStreak++;
    flushT = setTimeout(flush, Math.min(30000, 3000 * failStreak));   // 포기하지 않고 간격을 늘려 다시
  }).then(function () {
    inflight = false; banner(); if (S.view === 'loc' || S.view === 'choose') render();
    if (outbox().length && !flushT && failStreak === 0) flushT = setTimeout(flush, 300);
    sendIfWanted();   // [보내기]를 눌렀는데 휴대폰에만 있던 기록이 있었으면 → 다 올라간 뒤 이어서 보냄
  });
}
function saveCache() { if (S.data) lsSet(K.cache, JSON.stringify(S.data)); }
function banner() {
  var c = outbox().length, b = $('banner');
  if (!b) return;
  if (!CFG.apiUrl) { b.textContent = '설정 전: config.js에 구글 웹앱 주소가 없어요'; b.className = ''; return; }
  if (c) { b.textContent = '📶 아직 못 보낸 기록 ' + c + '건 — 휴대폰에 저장돼 있어요. 연결되면 자동으로 보내요'; b.className = ''; }
  else if (S.data && !S.fresh && S.loadFailed) { b.textContent = '인터넷 없이 저장된 자료로 보고 있어요 (' + esc((S.data.at || '').slice(5, 16)) + ' 받음)'; b.className = ''; }
  else { b.textContent = ''; b.className = 'hide'; }
}
window.addEventListener('online', function () { failStreak = 0; flush(); if (!S.fresh) load(); });
window.addEventListener('pagehide', function () { flush(true); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { flush(true); return; }
  failStreak = 0;
  // 도착 QR로 열린 다른 창에서 저장·그만뒀으면 이 창의 '옮기는 중' 화면을 닫음
  if ((S.view === 'waitdest' || S.view === 'confirmMove') && !pendGet()) { S.view = 'loc'; S.msg = { t: 'ok', s: '옮기기는 다른 창에서 끝났어요' }; render(); }

// ---------------------------------------------------------------- 자료 계산
function itemOf(code) {
  var it = ((S.data && S.data.items) || []).filter(function (x) { return x.code === code; })[0];
  return it || { code: code, name: code, per: 0 };
}
function stockAt(full) { return S.data.stock.filter(function (r) { return r.loc === full && (r.avail > 0 || r.stock > 0); }); }
function liveLog() { return S.data.log.filter(function (r) { return r.status !== '취소' && r.status !== '안 들어감'; }); }
function todayAt(full) { return S.data.log.filter(function (r) { return r.loc === full || r.from === full || r.to === full; }); }
function usedFromToday() { var u = {}; liveLog().forEach(function (r) { if (r.kind === 'bulk') u[r.from] = true; }); return u; }
// 1단 보충 후보: 같은 품목 2·3단 파레트, 유통기한 빠른 LOT → 덜 찬 파레트 → 자리 알파벳 (업무허브 refill_candidates와 같은 순서)
function candidates(code, exceptFull) {
  var used = usedFromToday(), byLoc = {};
  S.data.stock.forEach(function (r) {
    var p = parseLoc(r.loc);
    if (r.code !== code || r.avail <= 0 || !p || p.level === 1 || r.loc === exceptFull) return;
    var k = r.loc + '|' + r.lot;
    if (!byLoc[k]) byLoc[k] = { loc: r.loc, lot: r.lot, exp: r.exp, avail: 0 };
    byLoc[k].avail += r.avail;
  });
  var list = Object.keys(byLoc).map(function (k) { return byLoc[k]; });
  list.sort(function (a, b) {
    var x = a.exp || '9999', y = b.exp || '9999';
    return x < y ? -1 : x > y ? 1 : a.lot < b.lot ? -1 : a.lot > b.lot ? 1 : a.avail - b.avail || (a.loc < b.loc ? -1 : 1);
  });
  list.forEach(function (c) { c.used = !!used[c.loc]; });
  return list.filter(function (c) { return !c.used; }).concat(list.filter(function (c) { return c.used; }));
}

// ---------------------------------------------------------------- 화면 조각 (2026-11-13 업무허브와 같은 모양)

// ---- 2026-11-13 김문수 님 "오전 재고보충 때 많이 옮기니 아래 칸에 이동 내역 목록을 만들어 놓고, 이동이 끝나면 [전송하기], 취소도"

function unsent() { return S.data ? S.data.log.filter(function (r) { return r.worker === S.worker && (r.status === '새로' || r.status === '보내는 중'); }) : []; }

function sendAll(auto) {

  }
  api('phoneSend', { ids: un.map(function (r) { return r.id; }), worker: S.worker }).then(function (j) {
    lsSet('mm_send_wanted', null);

    S.data.log.forEach(function (r) { if (ok[r.id]) r.status = '보냄'; });

    S.msg = { t: 'ok', s: '✓ ' + j.sent.length + '건을 사무실로 보냈어요 — 1~2분 안에 업로드 파일과 메일이 만들어져요' +

    render();
  }).catch(function (e) {

function send(rec) {
  var d = new Date();
  rec.id = newId(d); rec.time = nowText(d); rec.worker = S.worker;
  var box = outbox(); box.push(rec); setOutbox(box);
  S.data.log.push(Object.assign({ date: rec.time.slice(0, 10), status: '보내는 중' }, rec));
  saveCache();
  S.msg = { t: 'ok', s: '✓ 저장했어요 (' + rec.time.slice(11, 16) + ')' + (navigator.onLine === false ? ' — 휴대폰에 저장, 연결되면 보내요' : '') };
  S.view = 'loc'; S.form = null; render();
  flush();
}
function cancelRec(id) {
  if (!confirm('이 기록을 취소할까요?')) return;
  var box = outbox();
  if (box.some(function (r) { return r.id === id; })) {           // 아직 안 보낸 기록 → 휴대폰에서만 지움
    setOutbox(box.filter(function (r) { return r.id !== id; }));
    S.data.log.forEach(function (r) { if (r.id === id) r.status = '취소'; });
    saveCache(); S.msg = { t: 'ok', s: '취소했어요' }; render(); return;
  }
  api('phoneCancel', { id: id, worker: S.worker }).then(function (j) {
    if (!j.done) { S.msg = { t: 'err', s: j.error || '취소 못 했어요' }; render(); return; }
    S.data.log.forEach(function (r) { if (r.id === id) r.status = '취소'; });
    saveCache(); S.msg = { t: 'ok', s: '취소했어요' }; render();
  }).catch(function (e) {
    if (e.code === 'pin') return pinFail();
    S.msg = { t: 'err', s: '보낸 기록 취소는 인터넷이 되어야 해요. (' + e.message + ')' }; render();
  });
}

  var mine = S.data.log.filter(function (r) { return r.worker === S.worker; });
  h += '<div class="card"><h3>🕘 오늘 내 기록 (' + mine.filter(function (r) { return r.status !== '취소' && r.status !== '안 들어감'; }).length + '건)</h3>';
  if (!mine.length) h += '<div class="muted">아직 없어요</div>';
  mine.slice().reverse().forEach(function (r) { h += recLine(r); });
  h += '</div>';
  if (unsent().length) h += bigBtn('', 'sendAll()', '📤', '이동 끝 — 사무실로 보내기 (' + unsent().length + '건)');
  if (parseLoc(S.loc)) h += bigBtn('gray', 'back()', '←', esc(parseLoc(S.loc).short) + '(으)로 돌아가기');
  return h;
}
function openChosen() {
  var c = S.choose, p = parseLoc(c.row + c.level + '-' + c.bay);
  if (!c.row || !p) { S.msg = { t: 'err', s: '줄과 칸 번호를 골라 주세요' }; render(); return; }
  S.loc = p.short; S.view = 'loc'; S.msg = null;
  try { history.replaceState(null, '', '?loc=' + p.short); } catch (e) {}
  pendRoute();   // 옮기는 중이면 → 이 자리로 확인 화면
  render();
}

// 받은(또는 저장해 둔) 자료에 아직 못 보낸 기록을 다시 얹음. 저장해 둔 자료가 어제 것이면 기록은 비움
function mergeOutbox() {
  if (!S.data) return;
  if (S.data.today !== nowText().slice(0, 10)) { S.data.log = []; S.data.today = nowText().slice(0, 10); }
  var have = {}; S.data.log.forEach(function (r) { have[r.id] = true; });
  outbox().forEach(function (r) { if (!have[r.id]) S.data.log.push(Object.assign({ date: r.time.slice(0, 10), status: '보내는 중' }, r)); });
}
mergeOutbox();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
render();
load();
</script>
</body>
</html>
